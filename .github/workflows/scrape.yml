name: Job Scraper

on:
  schedule:
    # 08:12 in Zürich/München. GitHub Actions cron läuft in UTC, daher
    # entspricht das je nach Sommer-/Winterzeit 06:12 oder 07:12 UTC.
    # Aktuell auf Sommerzeit (UTC+2) eingestellt -> ggf. 2x jährlich anpassen,
    # siehe README "Cron & Zeitzone". Bewusst NICHT auf die volle Stunde
    # gelegt - GitHub warnt, dass Scheduled Workflows genau "on the hour"
    # (v.a. bei hoher Last) verzögert oder übersprungen werden können.
    - cron: "12 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (nur falls benötigt)
        run: |
          if grep -q "method: *playwright" config.yaml; then
            playwright install --with-deps chromium
          else
            echo "Keine Firma nutzt method: playwright - Browser-Install übersprungen."
          fi

      - name: Scraper ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: State committen & pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen am State - kein Commit nötig."
          else
            git commit -m "chore: update job state [skip ci]"
            # Das Dashboard committet Status-Änderungen direkt per GitHub-API
            # nach main (siehe README "Geräteübergreifende Synchronisation") -
            # ein einfacher "git push" schlägt fehl, wenn währenddessen so ein
            # Commit reinkam. Bei Ablehnung: neu holen, draufrebasen, erneut
            # versuchen. Schlägt auch das fehl (echter Inhaltskonflikt statt
            # nur "überholt"), wird der State-Commit verworfen, statt den
            # ganzen Lauf (und damit den Pages-Deploy weiter unten) platzen zu
            # lassen - beim nächsten Lauf wird ohnehin neu gescraped.
            pushed=0
            for i in 1 2 3 4 5; do
              if git push; then
                pushed=1
                break
              fi
              echo "Push abgelehnt (vermutlich zwischenzeitlicher Dashboard-Commit) - Versuch $i/5, rebase und erneut versuchen..."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Rebase-Konflikt - State-Commit wird für diesen Lauf verworfen."
                break
              fi
            done
            if [ "$pushed" -ne 1 ]; then
              echo "State-Commit konnte nicht gepusht werden - Lauf läuft trotzdem weiter (Dashboard-Artifact nutzt den lokal bereits generierten Stand)."
              git reset --soft HEAD~1
            fi
          fi

      - name: Dashboard als Pages-Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
