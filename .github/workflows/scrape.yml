name: Job Scraper

on:
  schedule:
    # 08:12 in Zürich/München - ganzjährig. GitHub-Actions-Cron läuft in UTC
    # und kennt keine Zeitzonen, daher zwei Einträge: 06:12 UTC (= 08:12
    # Sommerzeit, UTC+2) und 07:12 UTC (= 08:12 Winterzeit, UTC+1). Der Job
    # "gate" unten lässt pro Tag nur den Eintrag laufen, der zur aktuell
    # gültigen Zeit in Europe/Zurich passt - keine manuelle Umstellung nötig.
    # Bewusst NICHT auf die volle Stunde gelegt - GitHub warnt, dass Scheduled
    # Workflows genau "on the hour" (v.a. bei hoher Last) verzögert oder
    # übersprungen werden können.
    - cron: "12 6 * * *"
    - cron: "12 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Entscheidet anhand des auslösenden Cron-Eintrags (nicht der aktuellen
  # Uhrzeit - GitHub startet geplante Läufe teils mit Verzögerung), ob dieser
  # Lauf der "richtige" für die aktuelle Sommer-/Winterzeit ist. Manuelle
  # Starts (workflow_dispatch) laufen immer.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(TZ=Europe/Zurich date +%z)" = "+0200" ]; then
            wanted="12 6 * * *"   # Sommerzeit
          else
            wanted="12 7 * * *"   # Winterzeit
          fi
          if [ "${{ github.event.schedule }}" = "$wanted" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cron '${{ github.event.schedule }}' passt nicht zur aktuellen Zeitzone (erwartet '$wanted') - Lauf übersprungen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (nur falls benötigt)
        run: |
          if grep -q "method: *playwright" config.yaml; then
            playwright install --with-deps chromium
          else
            echo "Keine Firma nutzt method: playwright - Browser-Install übersprungen."
          fi

      - name: Scraper ausführen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: State committen & pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen am State - kein Commit nötig."
          else
            git commit -m "chore: update job state [skip ci]"
            # Das Dashboard committet Status-Änderungen direkt per GitHub-API
            # nach main (siehe README "Geräteübergreifende Synchronisation") -
            # ein einfacher "git push" schlägt fehl, wenn währenddessen so ein
            # Commit reinkam. Bei Ablehnung: neu holen, draufrebasen, erneut
            # versuchen. Schlägt auch das fehl (echter Inhaltskonflikt statt
            # nur "überholt"), wird der State-Commit verworfen, statt den
            # ganzen Lauf (und damit den Pages-Deploy weiter unten) platzen zu
            # lassen - beim nächsten Lauf wird ohnehin neu gescraped.
            pushed=0
            for i in 1 2 3 4 5; do
              if git push; then
                pushed=1
                break
              fi
              echo "Push abgelehnt (vermutlich zwischenzeitlicher Dashboard-Commit) - Versuch $i/5, rebase und erneut versuchen..."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Rebase-Konflikt - State-Commit wird für diesen Lauf verworfen."
                break
              fi
            done
            if [ "$pushed" -ne 1 ]; then
              echo "State-Commit konnte nicht gepusht werden - Lauf läuft trotzdem weiter (Dashboard-Artifact nutzt den lokal bereits generierten Stand)."
              git reset --soft HEAD~1
            fi
          fi

      - name: Dashboard als Pages-Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
