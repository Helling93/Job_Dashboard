# Konfiguration der überwachten Firmen-Karriereseiten.
#
# Pro Firma werden CSS-Selektoren angegeben, mit denen die Job-Liste aus dem
# HTML extrahiert wird. Diese Selektoren sind pro Firma unterschiedlich und
# müssen gegen die echte Seite getestet werden (dafür gibt es tests/test_scraper.py
# und tests/fixtures/sample_company.html als Vorlage).
#
# Felder:
#   name              Anzeigename der Firma
#   url               URL der Karriereseite (oder eines von der Seite selbst
#                      genutzten Daten-Endpoints, siehe BMW-Beispiel unten)
#   method             "requests" (Standard, schnell, kein JS-Rendering)
#                      oder "playwright" (falls die Seite Inhalte per JS
#                      nachlädt / Bot-Schutz requests-Anfragen blockiert)
#   list_selector      CSS-Selektor, der JEDES einzelne Job-Element matcht
#   title_selector     CSS-Selektor für den Jobtitel, relativ zum Job-Element
#   title_attr         optional: Attribut statt Text für den Titel auslesen
#   link_selector      CSS-Selektor für den <a>-Tag mit dem Link, relativ zum
#                      Job-Element. Spezialwert "self": das Job-Element ist
#                      selbst der <a>-Tag (kein verschachtelter Link vorhanden)
#   link_attr          Attribut, das den Link enthält (Standard: href)
#   base_url           Wird vor relative Links gehängt
#   location_selector  optional, CSS-Selektor für den Standort
#   location_attr      optional: Attribut statt Text für den Standort
#   date_selector       optional, CSS-Selektor für das Veröffentlichungsdatum
#   date_attr           optional: Attribut statt Text für das Datum
#   category_selector   optional, CSS-Selektor für den Tätigkeitsbereich
#   category_attr       optional: Attribut statt Text für die Kategorie
#   filters             optional, zusätzlicher Filter NACH dem Scrapen:
#     location_contains:         nur Jobs, deren Standort einen dieser
#                                 Begriffe enthält (case-insensitive)
#     exclude_location_contains: Jobs mit einem dieser Begriffe im Standort
#                                 aussortieren
#     title_contains:            nur Jobs, deren Titel einen dieser Begriffe
#                                 enthält
#     exclude_title_contains:    Jobs mit einem dieser Begriffe im Titel
#                                 aussortieren
#     category_contains:         nur Jobs, deren Kategorie einen dieser
#                                 Begriffe enthält
#     exclude_category_contains: Jobs mit einem dieser Begriffe in der
#                                 Kategorie aussortieren
#   paginate            optional, true = url enthält "{page}" als Platzhalter
#                        (1-basiert), scraper.py holt Seiten nacheinander bis
#                        eine Seite keine Treffer mehr liefert
#                        Alternativ "{offset}" statt "{page}" für Seiten, die
#                        einen Start-Index erwarten (z.B. startrow=0/25/50) -
#                        dann page_size (Treffer pro Seite) mit angeben.
#   max_pages            optional, Sicherheitslimit für paginate bzw.
#                        next_page_selector (Standard: 15)
#   next_page_selector   optional, CSS-Selektor eines "Weiter"-Buttons
#                        (method: playwright) für Blätter-Pagination ohne
#                        eigene URL pro Seite (z.B. Workday) - alle Seiten
#                        werden nacheinander eingesammelt
#   load_more_selector    optional, CSS-Selektor eines "Mehr laden"-Buttons
#                         (method: playwright) - wird automatisch geklickt,
#                         bis er verschwindet/nicht mehr sichtbar ist
#   max_load_more_clicks   optional, Sicherheitslimit für load_more_selector
#                          (Standard: 20)
#   flatten_shadow_dom     optional, true (method: playwright) - manche
#                          Seiten (Web Components/Stencil.js, z.B. KNDS)
#                          rendern Inhalte in Shadow DOM, das normales
#                          page.content() nicht sieht. Kopiert Shadow-Root-
#                          Inhalte vor dem Serialisieren ins Light-DOM.
#   dismiss_selector       optional, CSS-Selektor oder Liste davon (method:
#                          playwright) für Banner/Filter-Buttons, die einmalig
#                          VOR dem Warten auf list_selector der Reihe nach
#                          weggeklickt werden - z.B. bei Destinus/Workable, wo
#                          zuerst ein Cookie-Banner und danach ein Geo-Filter
#                          (Jobs werden anhand der Besucher-IP automatisch auf
#                          ein Land vorgefiltert) im Weg steht. Wird ein
#                          Selektor nicht gefunden, passiert einfach nichts.

companies:
  # BMW Group: Die Karriereseite ist eine SPA, aber die Filter (Standort,
  # Tätigkeitsbereich) werden serverseitig über einen HTML-Fragment-Endpoint
  # aufgelöst, den die Seite selbst per JS aufruft. Plain requests wird von
  # Akamai-Botschutz geblockt (Timeout) - daher method: playwright, das lädt
  # den Endpoint über einen echten Browser-Kontext, was funktioniert.
  # filterSearch-Bausteine (über die Filter-UI der Seite ermittelt):
  #   location_DE/Munich          -> Standort München
  #   jobType_STANDARD            -> "Berufserfahrene"
  #   jobType_SUMMER_JOB          -> "Nachwuchsprogramme" (interner Code,
  #                                  trotz Namens keine Sommerjobs)
  #   jobField_ResearchDevelopment -> "Forschung / Entwicklung" (deckt u.a.
  #                                  Autonomes Fahren, Elektromobilität,
  #                                  Fahrwerk/Konstruktion ab)
  # blockCount=300 holt alle Treffer in einem Request (aktuell ~15).
  - name: "BMW Group"
    url: "https://www.bmwgroup.jobs/de/de/jobs/_jcr_content/main/layoutcontainer_copy_565949652/jobfinder30_copy.jobfinder_table.content.html?filterSearch=location_DE%2FMunich%2CjobType_STANDARD%2CjobType_SUMMER_JOB%2CjobField_ResearchDevelopment&rowIndex=0&blockCount=300"
    method: playwright
    base_url: "https://www.bmwgroup.jobs"
    list_selector: "a.grp-jobfinder__link-jobdescription"
    title_selector: ".grp-jobfinder-cell-refno"
    title_attr: "data-job-title"
    link_selector: "self"
    link_attr: "href"
    location_selector: ".grp-jobfinder-cell-refno"
    location_attr: "data-job-location"
    date_selector: ".grp-jobfinder-cell-refno"
    date_attr: "data-posting-date"
    category_selector: ".grp-jobfinder-cell-refno"
    category_attr: "data-job-field"
    filters:
      # Doktorand/PhD-Stellen kommen bei BMW über jobType_SUMMER_JOB
      # ("Nachwuchsprogramme") mit rein - werden hier rausgefiltert.
      exclude_title_contains: ["Doktorand", "PhD"]

  # Helsing (Verteidigungs-KI/autonome Systeme): Jobs-Seite ist serverseitig
  # gerendert (Next.js), inhaltlich reicht also method: requests - ABER der
  # Bot-Schutz (Cloudflare o.ä.) beantwortet plain requests nach wenigen
  # Anfragen kurzfristig mit 429, während ein echter Browser-Kontext
  # zuverlässig durchkommt. Daher method: playwright, obwohl kein JS-Rendering
  # nötig wäre - robuster für den täglichen automatisierten Lauf.
  # Kein eigener Standort-Filter-Endpoint vorhanden, daher Filterung über
  # `filters` unten. category_contains grenzt auf Engineering-nahe Bereiche
  # ein (schließt Finance/Legal/People/Marketing/Operations etc. aus).
  # Anpassen, falls zu eng/weit - verfügbare Kategorien siehe README-Hinweis.
  - name: "Helsing"
    url: "https://helsing.ai/de/jobs"
    method: playwright
    base_url: "https://helsing.ai"
    list_selector: 'a:has(div[data-label="Position"])'
    title_selector: 'div[data-label="Position"] span'
    link_selector: "self"
    link_attr: "href"
    location_selector: 'div[data-label="Location"] span'
    category_selector: 'div[data-label="Type"] span'
    filters:
      location_contains: ["Munich"]
      exclude_title_contains: ["Closed Opportunity"]
      category_contains:
        - "Hardware Engineering"
        - "Deployed Engineering"
        - "Systems Architecture"
        - "Physical Products"
        - "Product Design"

  # Rheinmetall: Nuxt-SPA, Filter/Pagination laufen komplett client-seitig
  # über einen JSON-Query-Param ("filter={"countries":[...]}" bzw.
  # "{"cities":[...]}", über die Filter-UI der Seite ermittelt) - daher
  # method: playwright. "{page}" im Query-String wird von scraper.py pro
  # Seite ersetzt (paginate: true), da pro Seite nur 10 Treffer kommen.
  - name: "Rheinmetall (Schweiz)"
    url: "https://www.rheinmetall.com/de/karriere/aktuelle-stellenangebote?filter=%7B%22countries%22%3A%5B%22Switzerland%22%5D%7D&page={page}"
    method: playwright
    base_url: "https://www.rheinmetall.com"
    paginate: true
    max_pages: 15
    list_selector: 'div.flex.gap-0\.5.group'
    title_selector: 'a.flex-grow.pr-8 div.text-sm.font-bold.md\:text-xl'
    link_selector: "a.flex-grow.pr-8"
    link_attr: "href"
    location_selector: 'div.flex.justify-between div.flex.flex-wrap.mr-6'

  - name: "Rheinmetall (München)"
    url: "https://www.rheinmetall.com/de/karriere/aktuelle-stellenangebote?filter=%7B%22cities%22%3A%5B%22M%C3%BCnchen%22%5D%7D&page={page}"
    method: playwright
    base_url: "https://www.rheinmetall.com"
    paginate: true
    max_pages: 15
    list_selector: 'div.flex.gap-0\.5.group'
    title_selector: 'a.flex-grow.pr-8 div.text-sm.font-bold.md\:text-xl'
    link_selector: "a.flex-grow.pr-8"
    link_attr: "href"
    location_selector: 'div.flex.justify-between div.flex.flex-wrap.mr-6'

  # Audi F1 Team (Hinwil): Next.js, Jobdaten sind zwar serverseitig im
  # Response enthalten, aber erst nach JS-Hydration im DOM als <li> gerendert
  # (network-idle hängt sich wegen Hintergrund-Requests auf -> deshalb
  # domcontentloaded + Warten auf list_selector in scraper.py). Zusätzlich
  # zeigt die Seite initial nur 10 von 17 Treffern - load_more_selector lässt
  # scraper.py automatisch so oft klicken, bis alle geladen sind.
  - name: "Audi F1 Team (Hinwil)"
    url: "https://www.audif1.com/de/careers?office=Hinwil+Switzerland"
    method: playwright
    base_url: "https://www.audif1.com"
    load_more_selector: 'button:has-text("Load more")'
    list_selector: "li.col-span-1"
    title_selector: "p.text-copy-1"
    location_selector: "p.text-copy-3"
    link_selector: "a.link-base"
    link_attr: "href"

  # Quantum Systems (Drohnen/autonome Systeme): serverseitig gerendert
  # (requests reicht inhaltlich), zeigt aber initial nur 10 von z.B. 21
  # Treffern - load_more_selector klickt "Show more jobs" automatisch nach.
  # Filter (Standort, Department) direkt über die URL-Query-Parameter der
  # Filter-UI (jobs-f190661c[...]) eingebaut.
  - name: "Quantum Systems"
    url: "https://career.quantum-systems.com/?jobs-f190661c%5Btab%5D=DE&jobs-f190661c%5Bcity%5D%5B%5D=Gilching&jobs-f190661c%5Bcity%5D%5B%5D=Munich&jobs-f190661c%5Bcity%5D%5B%5D=M%C3%BCnchen&jobs-f190661c%5Bdepartment%5D%5B%5D=Hardware"
    method: playwright
    base_url: "https://career.quantum-systems.com"
    load_more_selector: 'button:has-text("Show more jobs")'
    list_selector: "table tbody tr"
    title_selector: "td a"
    link_selector: "td a"
    link_attr: "href"
    location_selector: 'li[data-testid="styled-location-list-item"]'

  # KNDS (Rüstung/Landsysteme, u.a. Boxer/Leopard): gebaut mit Stencil.js Web
  # Components - Jobs stecken im Shadow DOM, normales page.content() sieht
  # das nicht -> flatten_shadow_dom kopiert Shadow-Root-Inhalte vor dem
  # Serialisieren ins Light-DOM. pageSize=100 holt alle Treffer auf einmal
  # (keine Pagination nötig). Filter (Standort/Kategorie/Anstellungsart)
  # direkt über die URL-Query-Parameter der Filter-UI.
  - name: "KNDS"
    url: "https://jobs.knds.de/content/search/?locale=de_DE&currentPage=1&pageSize=100&addresses%2Fname=M%C3%BCnchen&category=Entwicklung&category=Projektmanagement&employmentType=Festanstellung"
    method: playwright
    base_url: "https://jobs.knds.de"
    flatten_shadow_dom: true
    list_selector: "a.search-item-wrapper"
    title_selector: ".title"
    link_selector: "self"
    link_attr: "href"
    location_selector: ".locations"

  # MBDA (Flugkörper/Raketensysteme, Schrobenhausen): serverseitig gerendert
  # per Playwright (plain requests liefert nur die leere Shell). Paginiert
  # (10 pro Seite) - "{page}" wird von scraper.py durchgezählt. Filter
  # (Fachgebiet/Arbeitsbereich/Standort/Zielgruppe) direkt über die
  # URL-Query-Parameter der Filter-UI.
  - name: "MBDA"
    url: "https://www.mbda-careers.de/ema/?_expertiseAreas[]=3&_expertiseAreas[]=4&_expertiseAreas[]=5&_expertiseAreas[]=7&_fieldOfWork[]=1&_fieldOfWork[]=5&_locations[]=Schrobenhausen&_order=ASC&_orderBy=date&_page={page}&_targetGroups[]=7&_targetGroups[]=6"
    method: playwright
    base_url: "https://www.mbda-careers.de"
    paginate: true
    max_pages: 15
    list_selector: "div.single-result"
    title_selector: "div.result-primary-text h3"
    link_selector: "div.result-primary-text a"
    link_attr: "href"
    location_selector: "div.col-location .result-text"
    category_selector: "div.result-secondary-text"

  # Embotech (autonome Fahrzeuge für Häfen/Yards, Zürich): Webflow-Seite,
  # Job-Liste ist eine serverseitig gerenderte CMS-Collection - method:
  # requests reicht. Bewerbung läuft extern per PDF-Ausschreibung/E-Mail statt
  # eigener Detailseite, daher zeigt link direkt auf das PDF.
  - name: "Embotech"
    url: "https://embotech.com/career"
    method: requests
    list_selector: ".w-dyn-item"
    title_selector: "h3.titel-open-positon"
    link_selector: "a.link-block-2"
    link_attr: "href"
    location_selector: ".location-open-positions-wrapper h4.thin"
    filters:
      exclude_location_contains: ["Rotterdam"]

  # Destinus (autonome Drohnen/Verteidigung, u.a. Zürich und München):
  # Workable-Jobboard (React-SPA) - method: playwright nötig. Die Seite
  # filtert Treffer initial automatisch anhand der Besucher-IP auf ein Land
  # (z.B. "Germany" oder was auch immer der GitHub-Actions-Runner gerade
  # auflöst) - dismiss_selector klickt den "Clear filters"-Link weg, damit
  # wirklich immer alle Länder durchsucht werden und die eigene
  # location_contains-Filterung unten zuverlässig greift. load_more_selector
  # lädt danach alle Treffer nach. Analog zu Rheinmetall in zwei
  # Dashboard-Einträge (Schweiz/München) aufgeteilt statt einem gemeinsamen -
  # beide fragen dieselbe Seite komplett ab, filtern nur unterschiedlich.
  - name: "Destinus (Schweiz)"
    url: "https://apply.workable.com/destinusgroup/"
    method: playwright
    base_url: "https://apply.workable.com"
    dismiss_selector:
      - 'button:has-text("Decline all")'
      - 'a:has-text("Clear filters")'
    load_more_selector: 'button:has-text("Show more")'
    list_selector: 'li[data-ui="job"]'
    title_selector: '[data-ui="job-title"]'
    link_selector: "a"
    link_attr: "href"
    location_selector: '[data-ui="job-location"]'
    category_selector: '[data-ui="job-department"]'
    filters:
      location_contains: ["Zürich", "Zurich"]

  - name: "Destinus (München)"
    url: "https://apply.workable.com/destinusgroup/"
    method: playwright
    base_url: "https://apply.workable.com"
    dismiss_selector:
      - 'button:has-text("Decline all")'
      - 'a:has-text("Clear filters")'
    load_more_selector: 'button:has-text("Show more")'
    list_selector: 'li[data-ui="job"]'
    title_selector: '[data-ui="job-title"]'
    link_selector: "a"
    link_attr: "href"
    location_selector: '[data-ui="job-location"]'
    category_selector: '[data-ui="job-department"]'
    filters:
      location_contains: ["Munich", "München"]

  # Flux Mobility (Elektro-Nutzfahrzeuge, Winterthur): Webflow-Seite, Job-Liste
  # ist eine serverseitig gerenderte CMS-Collection - method: requests reicht.
  # Verlinkt direkt auf die jeweilige Lever-Bewerbungsseite.
  - name: "Flux Mobility"
    url: "https://www.fluxmobility.ch/unternehmen/karriere"
    method: requests
    list_selector: "a.offene-stellen__itembox"
    title_selector: "h4.usp__text"
    link_selector: "self"
    link_attr: "href"
    location_selector: ".testimonial__function"

  # Large Space Structures / LSS GmbH (Weltraumantennen/-strukturen, Garching
  # bei München): einfache WordPress-Seite (Gutenberg-Blocks), method:
  # requests reicht. Kein eigenes Job-Element pro Eintrag - jede Vakanz ist
  # eine "wp-block-column" mit Titel-Absatz + "More Info"-Button, daher
  # :has() zur Eingrenzung auf Spalten mit Bewerbungslink (die Seite hat noch
  # weitere wp-block-column für Layout/Bilder ohne Job-Bezug).
  - name: "Large Space Structures"
    url: "https://www.largespace.de/current-vacancies/"
    method: requests
    list_selector: ".wp-block-column:has(a.wp-block-button__link)"
    title_selector: "p"
    link_selector: "a.wp-block-button__link"
    link_attr: "href"

  # Autonomous Teaming / ATS (Machine-Vision für Drohnenschwarm-Abwehr,
  # München/Berlin/Toulouse): Personio-Jobboard, serverseitig gerendert -
  # method: requests reicht. ".jb-title"/".jb-description" sind Personios
  # eigene (stabile) Utility-Klassen neben den gehashten CSS-Modul-Klassen -
  # robuster als über Letztere zu gehen. Erstes Meta-Element pro Job ist
  # immer der Standort, drittes die Anstellungsart.
  - name: "Autonomous Teaming"
    url: "https://autonomous-teaming.jobs.personio.de/"
    method: requests
    base_url: "https://autonomous-teaming.jobs.personio.de"
    list_selector: "a.job-box"
    title_selector: ".jb-title"
    link_selector: "self"
    link_attr: "href"
    location_selector: ".jb-description > div:nth-of-type(1) span"
    category_selector: ".jb-description > div:nth-of-type(3) span"

  # ARX Robotics (unbemannte Bodenfahrzeuge/UGVs für Verteidigung, München):
  # Greenhouse-Jobboard (EU-Instanz), serverseitig gerendert - method:
  # requests reicht. Zeigt max. 50 Jobs pro Seite, daher paginate über
  # "?page=". Alle Stellen sind in München, kein Standortfilter nötig.
  - name: "ARX Robotics"
    url: "https://job-boards.eu.greenhouse.io/arxroboticsgmbh?page={page}"
    method: requests
    paginate: true
    max_pages: 5
    list_selector: "tr.job-post"
    title_selector: "p.body--medium"
    link_selector: "a"
    link_attr: "href"
    location_selector: "p.body--metadata"

  # Auterion (Autonomie-Software für Drohnen/Verteidigung, Zürich): die
  # Karriereseite bettet ein Greenhouse-Jobboard per iframe ein - hier direkt
  # die (serverseitig gerenderte) Embed-URL. Links zeigen auf auterion.com.
  # Hinweis: die US-Greenhouse-Instanz antwortet gelegentlich kurz mit
  # 502/503 - die Retries in fetch_html_with_retry fangen das meist ab.
  - name: "Auterion"
    url: "https://job-boards.greenhouse.io/embed/job_board?for=auterion"
    method: requests
    list_selector: "tr.job-post"
    title_selector: "p.body--medium"
    link_selector: "a"
    link_attr: "href"
    location_selector: "p.body--metadata"
    filters:
      location_contains: ["Zurich", "Zürich"]

  # The Exploration Company (Raumkapsel Nyx, Planegg bei München): Ashby-
  # Jobboard (React-SPA) - method: playwright. Die Detailzeile pro Job
  # ("Abteilung • Standort(e) • Anstellungsart") wird als Standort genommen,
  # darüber lassen sich Standort UND Praktika ("• Intern") filtern.
  - name: "The Exploration Company"
    url: "https://jobs.ashbyhq.com/the-exploration-company"
    method: playwright
    base_url: "https://jobs.ashbyhq.com"
    list_selector: 'a[href^="/the-exploration-company/"]:has(h3)'
    title_selector: "h3"
    link_selector: "self"
    link_attr: "href"
    location_selector: ".ashby-job-posting-brief-details p"
    filters:
      location_contains: ["Munich"]
      exclude_location_contains: ["Intern"]

  # Tytan Technologies (KI-Abfangdrohnen, München): Recruitee-Jobboard,
  # serverseitig gerendert - method: requests reicht. CSS-Klassen sind
  # gehasht (styled-components), daher über data-testid + Struktur (Karte =
  # div mit verschachteltem /o/-Link) statt über Klassennamen.
  - name: "Tytan Technologies"
    url: "https://tytantechnologiesgmbh.recruitee.com/"
    method: requests
    base_url: "https://tytantechnologiesgmbh.recruitee.com"
    list_selector: '[data-testid="offer-list-cards-desktop-display"] div:has(> div > div > a[href^="/o/"])'
    title_selector: 'a[href^="/o/"]'
    link_selector: 'a[href^="/o/"]'
    link_attr: "href"
    location_selector: '[data-testid="styled-location-list-item"]'
    filters:
      location_contains: ["Munich", "München"]
      exclude_title_contains: ["Talent Pool"]

  # IABG (Test/V&V, Systemanalyse für Verteidigung & Luftfahrt, Ottobrunn):
  # Jobbörse (Java-"engage/jobexchange"), die Trefferliste erscheint erst
  # nach Absenden des Suchformulars (POST) - daher method: playwright und
  # dismiss_selector klickt einmal auf "Suchen" (leere Suche = alle Jobs).
  # Spalten: Bezeichnung | Zielgruppe | Standort.
  - name: "IABG"
    url: "https://jobboerse.iabg.de/engage/jobexchange/searchJobOffersQuick.do?languageChanged=true&j=myjobexchange"
    method: playwright
    dismiss_selector: 'input[value="Suchen"]'
    list_selector: "tr.joboffer"
    title_selector: "td:nth-of-type(1) a"
    link_selector: "td:nth-of-type(1) a"
    link_attr: "href"
    category_selector: "td:nth-of-type(3) a"
    location_selector: "td:nth-of-type(5) a"
    filters:
      location_contains: ["Ottobrunn", "München"]
      exclude_category_contains: ["Werkstudent", "Masterand"]

  # Hensoldt (Sensorik/Verteidigungselektronik, Taufkirchen): SAP
  # SuccessFactors-Karriereseite, serverseitig gerendert - method: requests.
  # 25 Treffer pro Seite, Blättern über "startrow=0/25/50..." - daher
  # "{offset}" + page_size statt "{page}". Standortfilter über die Suche.
  - name: "Hensoldt (Taufkirchen)"
    url: "https://jobs.hensoldt.net/search/?q=&locationsearch=Taufkirchen&startrow={offset}"
    method: requests
    base_url: "https://jobs.hensoldt.net"
    paginate: true
    page_size: 25
    max_pages: 8
    list_selector: "li.job-tile"
    title_selector: "a.jobTitle-link"
    link_selector: "a.jobTitle-link"
    link_attr: "href"
    filters:
      exclude_title_contains: ["Masterarbeit", "Bachelorarbeit", "Abschlussarbeit", "Duales Studium"]

  # Airbus Defence and Space (Manching, Taufkirchen/Ottobrunn, München):
  # Workday-Jobportal (SPA) - method: playwright. Filter über die URL-
  # Parameter der Filter-UI (IDs aus Workdays Facetten):
  #   locations       -> Manching, München Area, Taufkirchen / Ottobrunn
  #   workerSubType   -> Regular (keine Studenten/Azubis/Befristete)
  #   jobFamilyGroup  -> Engineering, Manuf./Assembly/Integr. & Test, Management
  # Workday zeigt 20 Treffer pro Seite ohne eigene URL pro Seite -
  # next_page_selector klickt sich durch und sammelt alle Seiten ein.
  - name: "Airbus Defence and Space"
    url: "https://ag.wd3.myworkdayjobs.com/de-DE/Airbus/jobs?locations=f5811cef9cb501505ee2ac6a4c0aff49&locations=f5811cef9cb501a49eac0a694c0a8244&locations=f5811cef9cb50199bf69196b4c0a674b&workerSubType=f5811cef9cb501a69768a71d470a6d15&jobFamilyGroup=f5811cef9cb5018463377f3f550a1bf2&jobFamilyGroup=f5811cef9cb5010551c57e3f550a19f2&jobFamilyGroup=f5811cef9cb50102a000803f550a1ff2"
    method: playwright
    base_url: "https://ag.wd3.myworkdayjobs.com"
    list_selector: 'li:has(a[data-automation-id="jobTitle"])'
    title_selector: 'a[data-automation-id="jobTitle"]'
    link_selector: 'a[data-automation-id="jobTitle"]'
    link_attr: "href"
    location_selector: '[data-automation-id="locations"] dd'
    date_selector: '[data-automation-id="postedOn"] dd'
    next_page_selector: 'button[data-uxi-element-id="next"]'
    max_pages: 10

  # thyssenkrupp Presta (Lenkungssysteme/Steer-by-Wire, Eschen FL): läuft
  # über das Konzern-Jobboard (Next.js) - die gefilterte Liste wird erst
  # clientseitig geladen, daher method: playwright. Filter auf Land
  # Liechtenstein (enthält neben Presta auch die Schwester-Gesellschaft
  # Dynamic Components TecCenter in Eschen). Die Gesellschaft landet als
  # Kategorie im Dashboard.
  - name: "thyssenkrupp Presta (Eschen)"
    url: "https://jobs.thyssenkrupp.com/de?locations.country=Liechtenstein"
    method: playwright
    base_url: "https://jobs.thyssenkrupp.com"
    list_selector: "tr.group"
    title_selector: 'a[href*="/job/"]'
    link_selector: 'a[href*="/job/"]'
    link_attr: "href"
    category_selector: "td:nth-of-type(1) p"
    location_selector: "td:nth-of-type(3) p"

  # Kistler (Messtechnik/Prüfstände, Winterthur): Angular-Seite - method:
  # playwright. "?country=CH" filtert auf die Schweiz (alle Stellen dort
  # sind in Winterthur); location_contains als Absicherung, falls der
  # Länderfilter mal nicht greift.
  - name: "Kistler"
    url: "https://www.kistler.com/CH/en/jobs?country=CH"
    method: playwright
    base_url: "https://www.kistler.com"
    list_selector: "div.job"
    title_selector: "a.job__description"
    link_selector: "a.job__description"
    link_attr: "href"
    location_selector: "span.job__position"
    filters:
      location_contains: ["Winterthur"]
      exclude_title_contains: ["INITIATIV"]

  # Bosch (Stellenportal Deutschland, Next.js): die Filter stecken in der URL
  # (Standorte Garching/München-Mitte/München-Neuperlach/München,
  # Berufserfahrene, Arbeitsbereiche Technik/Ingenieurwesen sowie Forschung,
  # Voraus- und Technologieentwicklung). Die Trefferliste wird clientseitig
  # nachgeladen, daher method: playwright. Jede Job-Karte ist selbst ein
  # <a href="/job/...">. Der Standort-Text enthält das Label "Standort:".
  - name: "Bosch (München)"
    url: "https://jobs.bosch.de/?filter=locations.cityState%3AGarching+bei+M%C3%BCnchen_IN_+Bayern%2Clocations.cityState%3AM%C3%BCnchen-Mitte_IN_+Bayern%2Clocations.cityState%3AM%C3%BCnchen-Neuperlach_IN_+Bayern%2Clocations.cityState%3AM%C3%BCnchen_IN_+Bayern%2CentryLevel%3ABerufserfahrene%2CjobField%3ATechnik%2FIngenieurwesen%2CjobField%3AForschung_IN_+Voraus-+und+Technologieentwicklung"
    method: playwright
    base_url: "https://jobs.bosch.de"
    list_selector: 'a[href^="/job/"]'
    title_selector: "p.text-primary"
    link_selector: "self"
    link_attr: "href"
    location_selector: "div.grid > div:nth-of-type(1) > div"
    category_selector: "div.grid > div:nth-of-type(2) p:nth-of-type(2)"

  # MAN Truck & Bus (SuccessFactors-Jobbörse, neue RMK-Oberfläche): Facetten
  # als JSON im URL-Parameter facetFilters - filter1 = Funktionsbereich
  # ("Forschung und Entwicklung"), filter6 = Karrierestufe ("Berufserfahrene").
  # Die Jobliste wird in Shadow DOM (UI5 Web Components) gerendert, daher
  # method: playwright + flatten_shadow_dom. Footer-Zeilen der Karte:
  # 1 = Karrierestufe, 2 = Funktionsbereich, 3 = Standort, 4 = Gesellschaft.
  - name: "MAN Truck & Bus"
    url: "https://jobs.man.eu/search/?q=&locale=de_DE&searchResultView=LIST&facetFilters=%7B%22filter1%22%3A%5B%22Forschung+und+Entwicklung%22%5D%2C%22filter6%22%3A%5B%22Berufserfahrene%22%5D%7D"
    method: playwright
    flatten_shadow_dom: true
    base_url: "https://jobs.man.eu"
    list_selector: 'li[data-testid="jobCard"]'
    title_selector: "a.jobCardTitle"
    link_selector: "a.jobCardTitle"
    link_attr: "href"
    location_selector: 'div[data-testid="jobCardFooter"] > div:nth-of-type(3) span:nth-of-type(2)'
    category_selector: 'div[data-testid="jobCardFooter"] > div:nth-of-type(4) span:nth-of-type(2)'

settings:
  # Auch verschwundene Jobs im Dashboard/History anzeigen
  track_disappeared: true
  # Bei Scraper-Fehlern (Seite nicht erreichbar / Selektor findet nichts) eine
  # Telegram-Warnung senden
  notify_on_error: true
  # Bei neuen Jobs eine Telegram-Nachricht senden
  notify_on_new_jobs: true

  # Wird vor dem Scrapen automatisch in JEDER Firma in filters.exclude_title_contains
  # gemergt (main.py) - Kategorien, die grundsätzlich nicht zum Profil passen
  # (M.Sc. Fahrzeugtechnik, Test-/Systems Engineering, Konstruktion), statt sie
  # pro Firma einzeln eintragen zu müssen. Prüfung ist Teilstring, case-insensitiv
  # (wie alle *_contains-Filter, siehe oben) - bewusst KEIN reiner Wortgrenzen-
  # Match, da deutsche Komposita (z.B. "Mechaniker" in "Geschützmechaniker")
  # sonst nicht mehr träfen. Deshalb bei kurzen/generischen Begriffen (z.B.
  # "Intern") auf Kollisionen mit anderen Wörtern achten (z.B. "international",
  # "interne") - hier deshalb bewusst spezifischere Varianten statt des bloßen
  # Worts "Intern".
  global_exclude_title_contains:
    # Praktika/Trainee-/Werkstudierenden-Programme - falsches Karrierelevel,
    # nicht nur ein einzelner Job, der nicht passt.
    - "Praktikant"
    - "Praktikum"
    - "Werkstudent"
    - "Trainee"
    - "Traineeship"
    - "Internship"
    - "Intern ("
    - "Intern –"
    - "Intern -"
    # Reine gewerbliche Fertigungs-/Technikerstellen (Arbeit direkt am Gerät/
    # in der Produktion, kein Ingenieurstudium vorausgesetzt) - fachlich zu
    # weit vom M.Sc.-Ingenieurprofil entfernt.
